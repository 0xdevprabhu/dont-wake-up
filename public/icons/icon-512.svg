<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="50%" stop-color="#FFCC80" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
    <linearGradient id="capGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#26C6DA" />
    </linearGradient>
    <linearGradient id="blanketGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#E65100" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Background with smooth squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad512)" filter="url(#shadow512)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.6" />

  <!-- White fluffy pillow -->
  <ellipse cx="256" cy="308" rx="180" ry="116" fill="#FFFFFF" opacity="0.95" />
  <ellipse cx="256" cy="308" rx="170" ry="106" fill="#F5F5F5" />

  <!-- Character Head (Mr. Snoozy) -->
  <circle cx="256" cy="260" r="112" fill="#FFE0B2" />
  
  <!-- Rosy Cheeks -->
  <circle cx="192" cy="286" r="24" fill="#FF8A80" opacity="0.65" />
  <circle cx="320" cy="286" r="24" fill="#FF8A80" opacity="0.65" />

  <!-- Sleeping Closed Eyes (curved eyelashes) -->
  <path d="M 186 250 Q 208 272 230 250" fill="none" stroke="#5D4037" stroke-width="12" stroke-linecap="round" />
  <path d="M 282 250 Q 304 272 326 250" fill="none" stroke="#5D4037" stroke-width="12" stroke-linecap="round" />

  <!-- Cute button nose -->
  <ellipse cx="256" cy="274" rx="11" ry="8" fill="#FFAB91" />

  <!-- Peaceful sleeping smile -->
  <path d="M 242 298 Q 256 312 270 298" fill="none" stroke="#6D4C41" stroke-width="9" stroke-linecap="round" />

  <!-- Nightcap Hat -->
  <path d="M 166 218 Q 256 138 346 218 Q 368 160 395 133 Q 410 200 333 208 Z" fill="url(#capGrad512)" />
  <!-- Hat rim -->
  <ellipse cx="256" cy="214" rx="96" ry="24" fill="#E0F7FA" />
  <!-- Hat pom-pom -->
  <circle cx="400" cy="133" r="27" fill="#FFFFFF" stroke="#80DEEA" stroke-width="5" />

  <!-- Blanket at bottom -->
  <path d="M 106 358 Q 256 315 406 358 C 422 400 395 440 256 440 C 117 440 90 400 106 358 Z" fill="url(#blanketGrad512)" />
  <path d="M 106 358 Q 256 315 406 358" fill="none" stroke="#FFD54F" stroke-width="10" />

  <!-- Floating animated ZZZ text -->
  <g fill="#4A148C" opacity="0.85" font-family="Arial, sans-serif" font-weight="900">
    <text x="362" y="155" font-size="54">Z</text>
    <text x="405" y="107" font-size="70">Z</text>
    <text x="325" y="208" font-size="38">z</text>
  </g>
</svg>

